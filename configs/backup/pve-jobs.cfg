# /etc/pve/jobs.cfg — tâches de sauvegarde planifiées de Proxmox VE
vzdump: backup-038537a4-0c8e
	comment Sauvegarde de secours du CT 107 (PBS) sur le HDD
	schedule sun 03:00
	compress zstd
	enabled 1
	fleecing 0
	mode snapshot
	notes-template {{guestname}}
	notification-mode notification-system
	prune-backups keep-last=4
	storage HDD-2TO
	vmid 107

vzdump: pbs-nuit
	comment PBS Buffalo : toutes les machines (le PBS est sauvegardé à part)
	schedule 01:00
	all 1
	enabled 1
	exclude 107,<EXCLU>
	mode snapshot
	notes-template {{guestname}}
	notification-mode notification-system
	storage pbs-buffalo

