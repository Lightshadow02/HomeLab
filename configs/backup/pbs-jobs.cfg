# Configuration Proxmox Backup Server (prune.cfg, sync.cfg, verification.cfg, datastore.cfg)
prune: buffalo-retention
	comment 7 jours, 4 semaines, 6 mois
	keep-daily 7
	keep-monthly 6
	keep-weekly 4
	schedule 02:30
	store buffalo

prune: hdd-retention
	comment 7 jours, 4 semaines, 6 mois
	keep-daily 7
	keep-monthly 6
	keep-weekly 4
	schedule 05:30
	store hdd
sync: copie-vers-hdd
	comment Copie quotidienne buffalo -> hdd
	remote-store buffalo
	remove-vanished false
	schedule 04:00
	store hdd
verification: buffalo-verif
	comment verification hebdo
	ignore-verified true
	outdated-after 30
	schedule sun 06:00
	store buffalo

verification: hdd-verif
	comment verification hebdo
	ignore-verified true
	outdated-after 30
	schedule sun 08:00
	store hdd
datastore: buffalo
	comment NAS Buffalo (disque NFS)
	gc-schedule 12:00
	notification-mode notification-system
	path /mnt/datastore/store

datastore: hdd
	comment HDD 2 To (copie de buffalo)
	gc-schedule 13:00
	notification-mode notification-system
	path /mnt/datastore-hdd/store
