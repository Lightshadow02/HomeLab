global:
  scrape_interval: 60s
  evaluation_interval: 60s
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
  - job_name: node-pve
    static_configs:
      - targets: ['10.255.255.252:9100']
        labels: {host: Proxmox-Host}
  - job_name: node-nas
    static_configs:
      - targets: ['192.168.70.148:9100']
        labels: {host: NEW-NAS}
  - job_name: pve
    metrics_path: /pve
    params: {module: [default], cluster: ['1'], node: ['1']}
    static_configs: [{targets: ['10.255.255.252']}]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: 'pve-exporter:9221'}
  - job_name: snmp-buffalo
    metrics_path: /snmp
    params: {module: [buffalo], auth: [buffalo]}
    scrape_timeout: 30s
    static_configs: [{targets: ['192.168.70.200'], labels: {host: Buffalo-TeraStation}}]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: 'snmp-exporter:9116'}
  - job_name: ping
    metrics_path: /probe
    params: {module: [icmp]}
    static_configs:
      - {targets: ['10.255.255.252'], labels: {target: Proxmox-Host}}
      - {targets: ['192.168.1.254'],  labels: {target: pfSense}}
      - {targets: ['10.255.255.254'], labels: {target: Routeur-amont}}
      - {targets: ['192.168.70.200'], labels: {target: Buffalo-TeraStation}}
      - {targets: ['192.168.70.148'], labels: {target: NEW-NAS}}
      - {targets: ['192.168.1.101'],  labels: {target: Docker-EXT}}
      - {targets: ['192.168.1.1'],    labels: {target: Docker}}
      - {targets: ['192.168.1.102'],  labels: {target: Jellyfin}}
      - {targets: ['10.0.0.100'],     labels: {target: Nextcloud}}
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: 'blackbox:9115'}
